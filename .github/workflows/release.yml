name: Release APK

# Jalankan setiap ada push (commit) ke master, atau manual dari tab Actions.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================
  # 1. Build & rilis APK dari master
  #    Versi diambil dari `versionName` di app/build.gradle.
  #    - versionName baru  -> dibuat release/tag baru
  #    - versionName sama  -> APK di release lama ditimpa
  # ============================================================
  release-current:
    name: Rilis APK (master)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK sesuai versi
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -n1)
          mv app/build/outputs/apk/debug/app-debug.apk "PaydayWidget-v${VERSION}.apk"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Buat GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" "PaydayWidget-v${VERSION}.apk" \
            --target "${GITHUB_SHA}" \
            --title "PaydayWidget v${VERSION}" \
            --notes "APK dibangun otomatis dari commit ${GITHUB_SHA}." \
          || gh release upload "v${VERSION}" "PaydayWidget-v${VERSION}.apk" --clobber

  # ============================================================
  # 2. Rilis versi-versi lama (backfill)
  #    Hanya berjalan saat workflow dijalankan MANUAL
  #    (tab Actions -> Release APK -> Run workflow).
  # ============================================================
  release-old-versions:
    if: github.event_name == 'workflow_dispatch'
    name: Rilis APK v${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 1.0.0
            commit: 9ef59586
          - version: 1.1.0
            commit: ee024dbc
          - version: 1.1.1
            commit: d3a3ba6e
    steps:
      - name: Checkout commit ${{ matrix.commit }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK sesuai versi
        run: mv app/build/outputs/apk/debug/app-debug.apk "PaydayWidget-v${{ matrix.version }}.apk"

      - name: Buat GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FULL_SHA=$(git rev-parse "${{ matrix.commit }}")
          gh release create "v${{ matrix.version }}" "PaydayWidget-v${{ matrix.version }}.apk" \
            --target "${FULL_SHA}" \
            --title "PaydayWidget v${{ matrix.version }}" \
            --notes "APK dibangun otomatis dari commit ${{ matrix.commit }}." \
          || gh release upload "v${{ matrix.version }}" "PaydayWidget-v${{ matrix.version }}.apk" --clobber
