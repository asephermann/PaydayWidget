plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'io.github.asephermann.paydaywidget'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "io.github.asephermann.paydaywidget"
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName "1.1.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // R8: shrink kode + resource untuk memperkecil ukuran APK
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
}

// Nama APK otomatis: PaydayWidget-v1.1.1(3)-debug.apk / PaydayWidget-v1.1.1(3)-release.apk
base {
    archivesName = "PaydayWidget-v${android.defaultConfig.versionName}(${android.defaultConfig.versionCode})"
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}